server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL_PG:jdbc:h2:mem:testdb}
    username: ${DB_USER_PG:sa}
    password: ${DB_PASS_PG:}
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/electricnose}
  redis:
    url: ${REDIS_URL:redis://localhost:6379}
jwt:
  secret: ${JWT_SECRET:mySecretKey}
mqtt:
  uri: ${MQTT_URI:tcp://localhost:1883}
  username: ${MQTT_USER:}
  password: ${MQTT_PASS:}
